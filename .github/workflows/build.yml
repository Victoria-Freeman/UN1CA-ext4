name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'sixteen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq, a73xq, m52xq, o1s, p3s, r9s, t2s]

    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 0.1
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh

      - name: Get ZIP filename
        id: get_filename
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          # Get the first zip file in out directory
          ZIP_FILE=$(ls out/*.zip | head -1)
          # Extract just the filename without path
          ZIP_NAME=$(basename "$ZIP_FILE")
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "Found ZIP file: $ZIP_NAME"
      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.get_filename.outputs.zip_name }}
          path: out/*.zip
          retention-days: 7
      - name: Upload to BuzzHeavier
        id: upload-buzz
        continue-on-error: true
        env:
          BUZZ_TOKEN: ${{ secrets.BUZZHEAVIER_TOKEN }}
          TARGET_DIR_ID: "iumn7vfs9n7d" # The ID from your API response
        run: |
          ZIP_NAME="${{ steps.get_filename.outputs.zip_name }}"
          echo "Uploading $ZIP_NAME to BuzzHeavier..."
          curl -#o /dev/null \
            -X PUT \
            -T "out/$ZIP_NAME" \
            -H "Authorization: Bearer $BUZZ_TOKEN" \
            "https://w.buzzheavier.com/$TARGET_DIR_ID/$ZIP_NAME"
          echo "Upload attempt finished. Check the job logs for curl's output."

